<!DOCTYPE html>
<html>
<head>
  <title>Blocked by PC Plus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1729;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }
    .shield {
      font-size: 80px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .url-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      word-break: break-all;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
    }
    .score {
      font-size: 18px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 16px;
    }
    .reasons {
      text-align: left;
      margin-bottom: 24px;
    }
    .reason {
      font-size: 14px;
      color: #cbd5e1;
      padding: 6px 0;
    }
    .reason:before { content: "• "; color: #ef4444; }
    .actions { display: flex; gap: 12px; justify-content: center; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-back { background: #22c55e; color: white; }
    .btn-proceed {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 12px;
    }
    .brand {
      margin-top: 40px;
      font-size: 12px;
      color: #475569;
    }
    .brand a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield">🛡️</div>
    <div class="title">Website Blocked</div>
    <div class="subtitle">PC Plus Endpoint Protection detected a threat</div>
    <div class="url-box" id="blockedUrl"></div>
    <div class="score" id="riskScore"></div>
    <div class="reasons" id="reasons"></div>
    <div class="actions">
      <a class="btn btn-back" href="javascript:history.back()">Go Back (Safe)</a>
    </div>
    <div class="brand">
      Protected by <a href="https://pcpluscomputing.com">PC Plus Computing</a>
      &mdash; Monitor. Protect. Secure.
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("blockedUrl").textContent = params.get("url") || "Unknown URL";
    document.getElementById("riskScore").textContent = "Risk Score: " + (params.get("score") || "?") + "/100";
    const reasons = (params.get("reasons") || "").split(", ").filter(Boolean);
    document.getElementById("reasons").innerHTML = reasons.map(r =>
      '<div class="reason">' + r.replace(/</g, "&lt;") + '</div>'
    ).join("");
  </script>
</body>
</html>
