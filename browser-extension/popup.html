<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1729;
      color: #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #1e3a5f, #0f1729);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e3a5f;
    }
    .header-icon { font-size: 28px; }
    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .header-text p {
      font-size: 11px;
      color: #60a5fa;
    }
    .status {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.active { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
    .status-dot.inactive { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
    .status-text {
      font-size: 13px;
      font-weight: 600;
    }
    .stats {
      padding: 0 16px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-number {
      font-size: 20px;
      font-weight: 700;
      color: #60a5fa;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .stat-box.danger .stat-number { color: #ef4444; }
    .features {
      padding: 0 16px 16px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    .feature-check { color: #22c55e; }
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #1e3a5f;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🛡️</div>
    <div class="header-text">
      <h1>PC Plus Endpoint Protection</h1>
      <p>Monitor. Protect. Secure.</p>
    </div>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Checking...</div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-number" id="scannedCount">0</div>
      <div class="stat-label">Links Scanned</div>
    </div>
    <div class="stat-box danger">
      <div class="stat-number" id="blockedCount">0</div>
      <div class="stat-label">Threats Blocked</div>
    </div>
  </div>

  <div class="features">
    <div class="feature"><span class="feature-check">✓</span> Email link scanning</div>
    <div class="feature"><span class="feature-check">✓</span> Real-time URL reputation</div>
    <div class="feature"><span class="feature-check">✓</span> Phishing feed protection</div>
    <div class="feature"><span class="feature-check">✓</span> DNS-level filtering</div>
    <div class="feature"><span class="feature-check">✓</span> Typosquatting detection</div>
  </div>

  <div class="footer">
    PC Plus Computing &mdash; <a href="https://pcpluscomputing.ca" target="_blank">pcpluscomputing.ca</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
